<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fallen Ruins – Cutscene</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800;900&family=Cinzel+Decorative:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #0a0907;
        --paper: #ffffff;
        --gold: #ffffff;
        --blood: #c0392b;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--ink);
        overflow: hidden;
        font-family: 'Cinzel', Georgia, serif;
        color: var(--paper);
      }
      #view {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #cam {
        position: absolute;
        left: 0;
        top: 0;
        width: 1024px;
        height: 1536px;
        transform-origin: 0 0;
        transition: transform 1.9s cubic-bezier(0.65, 0, 0.2, 1);
      }
      #drift {
        width: 1024px;
        height: 1536px;
        position: relative;
        animation: drift 14s ease-in-out infinite alternate;
      }
      @keyframes drift {
        from {
          transform: scale(1);
        }
        to {
          transform: scale(1.035) translate(-6px, -4px);
        }
      }
      #drift img {
        width: 1024px;
        height: 1536px;
        display: block;
        filter: contrast(1.05);
      }
      #shade {
        position: absolute;
        inset: 0;
        width: 1024px;
        height: 1536px;
      }
      .shake {
        animation: shake 0.5s linear 2;
      }
      @keyframes shake {
        0%,
        100% {
          transform: translate(0);
        }
        20% {
          transform: translate(-9px, 5px);
        }
        40% {
          transform: translate(8px, -6px);
        }
        60% {
          transform: translate(-6px, -4px);
        }
        80% {
          transform: translate(5px, 6px);
        }
      }
      #vig {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0, 0, 0, 0.85) 100%);
      }
      #fx {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #cap {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 48px 6vw calc(26px + env(safe-area-inset-bottom, 0px));
        background: linear-gradient(transparent, rgba(5, 4, 3, 0.92) 55%);
        text-align: center;
        opacity: 0;
        transition: opacity 0.8s;
        pointer-events: none;
      }
      #cap.on {
        opacity: 1;
      }
      #txt {
        font-size: clamp(17px, 2.2vw, 27px);
        line-height: 1.6;
        max-width: 900px;
        margin: 0 auto;
        min-height: 3.6em;
        font-family: 'Cinzel', Georgia, serif;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      #dots {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 12px;
      }
      #dots i {
        width: 34px;
        height: 3px;
        background: #ffffff30;
        transition: 0.5s;
      }
      #dots i.d {
        background: var(--gold);
      }
      #bar {
        position: absolute;
        top: calc(14px + env(safe-area-inset-top, 0px));
        right: 14px;
        display: flex;
        gap: 8px;
        z-index: 5;
        opacity: 0;
        transition: opacity 0.6s;
      }
      #bar.on {
        opacity: 1;
      }
      #bar button {
        background: rgba(0, 0, 0, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.4);
        color: var(--paper);
        font-family: 'Cinzel', Georgia, serif;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 1px;
        padding: 6px 16px;
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      #bar button:hover,
      button:focus-visible {
        border-color: var(--gold);
        outline: none;
        color: var(--gold);
      }
      #flash {
        position: absolute;
        inset: 0;
        background: #fff;
        opacity: 0;
        pointer-events: none;
        z-index: 8;
      }
      @media (prefers-reduced-motion: reduce) {
        #drift {
          animation: none;
        }
        #cam {
          transition-duration: 0.4s;
        }
      }
      #hint {
        position: absolute;
        top: calc(16px + env(safe-area-inset-top, 0px));
        left: 16px;
        font-family: 'Cinzel', Georgia, serif;
        font-size: 15px;
        letter-spacing: 0.5px;
        color: var(--gold);
        opacity: 0;
        transition: opacity 0.6s;
        z-index: 5;
        pointer-events: none;
      }
      #hint.on {
        opacity: 0.9;
      }
    </style>
  </head>

          'd',
          `M-50 -50H${W + 50}V${H + 50}H-50Z M${cur.map((a, i) => (i ? 'L' : '') + a.join(' ')).join('')}Z`,
        );
        rim.setAttribute('points', q);
      }
      function morph(to, ms = 1500, op = 1) {
        return new Promise((res) => {
          const from = cur.map((a) => a.slice()),
            t0 = performance.now();
          const e = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
          (function f(now) {
            const k = Math.min(1, (now - t0) / ms),
              s = e(k);
            cur = from.map((a, i) => [a[0] + (to[i][0] - a[0]) * s, a[1] + (to[i][1] - a[1]) * s]);
            draw();
            rim.style.opacity = op;
            k < 1 ? requestAnimationFrame(f) : res();
          })(t0);
        });
      }

      // ---------- camera ----------
      function bbox(p) {
        const x = p.map((a) => a[0]),
          y = p.map((a) => a[1]);
        return { x0: Math.min(...x), x1: Math.max(...x), y0: Math.min(...y), y1: Math.max(...y) };
      }
      function frame(p, pad = 0.88, cy = 0.42) {
        const b = bbox(p),
          vw = innerWidth,
          vh = innerHeight,
          bw = b.x1 - b.x0,
          bh = b.y1 - b.y0;
        const s = Math.min((vw * pad) / bw, (vh * 0.6) / bh);
        const cx = (b.x0 + b.x1) / 2,
          cyy = (b.y0 + b.y1) / 2;
        cam.style.transform = `translate(${vw / 2 - cx * s}px,${vh * cy - cyy * s}px) scale(${s})`;
      }
      function zoomPoint(x, y, s, ms = 1400) {
        cam.style.transitionDuration = ms + 'ms';
        cam.style.transform = `translate(${innerWidth / 2 - x * s}px,${innerHeight / 2 - y * s}px) scale(${s})`;
      }
      addEventListener('resize', () => {
        if (idx >= 0 && idx < PANELS.length) frame(PANELS[idx].p);
      });

      // ---------- audio: speech + synthesized sfx ----------
      let ac,
        voice,
        isTerminated = false,
        bootTimer = null;

      function terminateCutscene() {
        if (isTerminated) return;
        isTerminated = true;
        token++;
        if (bootTimer) clearTimeout(bootTimer);
        if (timer) clearTimeout(timer);
        clearInterval(typer);
        if (M) {
          clearInterval(M.t1);
          clearInterval(M.t2);
          try {
            M.out.gain.value = 0;
            M.out.disconnect();
          } catch (e) {}
          M = null;
        }
        if (ac) {
          try {
            ac.suspend();
            ac.close();
          } catch (e) {}
          ac = null;
        }
      }
      window.terminateCutscene = terminateCutscene;
      function initAudio() {
        try {
          ac = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {}
      }
      function noise(d, f0, f1, g = 0.5, type = 'lowpass') {
        if (!ac || muted || isTerminated) return;
        const n = ac.sampleRate * d,
          b = ac.createBuffer(1, n, ac.sampleRate),
          c = b.getChannelData(0);
        for (let i = 0; i < n; i++) c[i] = (Math.random() * 2 - 1) * (1 - i / n);
        const s = ac.createBufferSource();
        s.buffer = b;
        const f = ac.createBiquadFilter();
        f.type = type;
        f.frequency.setValueAtTime(f0, ac.currentTime);
        f.frequency.exponentialRampToValueAtTime(f1, ac.currentTime + d);
        const gn = ac.createGain();
        gn.gain.value = g;
        s.connect(f).connect(gn).connect(ac.destination);
        s.start();
      }
      function tone(fr, fr2, d, type = 'sine', g = 0.4) {
        if (!ac || muted || isTerminated) return;
        const o = ac.createOscillator(),
          gn = ac.createGain();
        o.type = type;
        o.frequency.setValueAtTime(fr, ac.currentTime);
        o.frequency.exponentialRampToValueAtTime(fr2, ac.currentTime + d);
        gn.gain.setValueAtTime(g, ac.currentTime);
        gn.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d);
        o.connect(gn).connect(ac.destination);
        o.start();
        o.stop(ac.currentTime + d);
      }
      const SFX = {
        zap() {
          tone(2400, 90, 0.5, 'sawtooth', 0.18);
          noise(0.6, 6000, 300, 0.35, 'bandpass');
        },
        crack() {
          noise(0.35, 5000, 200, 0.7);
          tone(120, 40, 0.5, 'square', 0.25);
        },
        whoosh() {
          noise(1.4, 200, 4000, 0.5, 'bandpass');
          tone(90, 500, 1.2, 'sine', 0.15);
        },
        roar() {
          tone(70, 35, 2.2, 'sawtooth', 0.35);
          noise(2, 900, 80, 0.4);
        },
        thud() {
          [0, 900, 1800].forEach((t) =>
            setTimeout(() => {
              tone(80, 28, 0.5, 'sine', 0.9);
              noise(0.3, 300, 40, 0.5);
              document.body.classList.remove('shake');
              void document.body.offsetWidth;
              cam.parentElement.classList.add('shake');
            }, t),
          );
        },
        boom() {
          tone(55, 20, 2.5, 'sine', 1);
          noise(1.5, 2000, 40, 0.8);
        },
      };
      async function speak(text, ms) {
        if (isTerminated) return;
        await hold(ms);
      }
      function type(text, ms) {
        clearInterval(typer);
        txt.textContent = '';
        let i = 0;
        const step = Math.max(20, (ms * 0.85) / text.length);
        typer = setInterval(() => {
          txt.textContent = text.slice(0, ++i);
          if (i >= text.length) clearInterval(typer);
        }, step);
      }
      async function hold(ms) {
        const t = token;
        let w = 0;
        while (w < ms) {
          await sleep(100);
          if (token !== t) return false;
          if (!paused) w += 100;
        }
        return true;
      }

      // ---------- cinematic score (synthesized) ----------
      let M = null;
      const CH = [
        [73.4, 110, 146.8, 174.6, 220],
        [58.3, 87.3, 116.5, 146.8, 174.6],
        [49, 73.4, 98, 116.5, 146.8],
        [55, 82.4, 110, 138.6, 164.8],
      ]; // Dm  Bb  Gm  A
      function startMusic() {
        if (!ac || M) return;
        const out = ac.createGain();
        out.gain.value = 0;
        const lp = ac.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 380;
        lp.Q.value = 0.7;
        const bus = ac.createGain(),
          pl = ac.createGain(),
          conv = ac.createConvolver(),
          wet = ac.createGain();
        wet.gain.value = 0.6;
        const len = ac.sampleRate * 3.5,
          ib = ac.createBuffer(2, len, ac.sampleRate);
        for (let c = 0; c < 2; c++) {
          const d = ib.getChannelData(c);
          for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
        }
        conv.buffer = ib;
        bus.connect(lp);
        lp.connect(out);
        pl.connect(out);
        out.connect(ac.destination);
        out.connect(conv);
        conv.connect(wet);
        wet.connect(ac.destination);
        M = { out, lp, bus, pl, level: 0, chord: 0, began: false };
        musVol(2.5);
        ac.onstatechange = () => {
          if (ac.state === 'running' && M && !M.began) chord();
        };
        if (ac.state === 'running') chord();
        M.t1 = setInterval(() => {
          if (M.began && ac.state === 'running') chord();
        }, 8000);
        M.t2 = setInterval(() => {
          if (!M.began || ac.state !== 'running' || !M.level) return;
          const g = M.level > 1 ? 1 : 0.6;
          tone(62, 30, 0.5, 'sine', 0.55 * g);
          setTimeout(() => tone(58, 28, 0.5, 'sine', 0.4 * g), 280);
        }, 1500);
      }
      function chord() {
        if (!M) return;
        M.began = true;
        const c = CH[M.chord++ % 4],
          T = ac.currentTime,
          D = 8;
        c.forEach((f, i) =>
          [-6, 6].forEach((dt) => {
            const o = ac.createOscillator(),
              g = ac.createGain();
            o.type = i < 2 ? 'sawtooth' : 'triangle';
            o.frequency.value = f;
            o.detune.value = dt;
            g.gain.setValueAtTime(0, T);
            g.gain.linearRampToValueAtTime(i < 2 ? 0.16 : 0.08, T + 3);
            g.gain.linearRampToValueAtTime(0, T + D + 2.5);
            o.connect(g).connect(M.bus);
            o.start(T);
            o.stop(T + D + 2.6);
          }),
        );
        for (let k = 0; k < 3; k++) {
          const f = c[2 + Math.floor(Math.random() * 3)] * 4,
            at = T + 1 + k * 2.4 + Math.random(),
            o = ac.createOscillator(),
            g = ac.createGain();
          o.type = 'sine';
          o.frequency.value = f;
          g.gain.setValueAtTime(0, at);
          g.gain.linearRampToValueAtTime(0.12, at + 0.02);
          g.gain.exponentialRampToValueAtTime(0.001, at + 3.5);
          o.connect(g).connect(M.pl);
          o.start(at);
          o.stop(at + 3.6);
        }
      }
      function musVol(tc = 0.8) {
        if (M) M.out.gain.setTargetAtTime(muted ? 0 : 0.42, ac.currentTime, tc);
      }
      function setLevel(n) {
        if (!M) return;
        M.level = n;
        M.lp.frequency.setTargetAtTime(380 + n * 650, ac.currentTime, 2);
      }
      function riser(d) {
        if (!ac || muted) return;
        const o = ac.createOscillator(),
          g = ac.createGain(),
          T = ac.currentTime;
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(90, T);
        o.frequency.exponentialRampToValueAtTime(1300, T + d);
        g.gain.setValueAtTime(0, T);
        g.gain.linearRampToValueAtTime(0.14, T + d);
        g.gain.linearRampToValueAtTime(0, T + d + 0.1);
        o.connect(g).connect(ac.destination);
        o.start(T);
        o.stop(T + d + 0.2);
      }
      function stopMusic() {
        if (!M) return;
        clearInterval(M.t1);
        clearInterval(M.t2);
        M.out.gain.setTargetAtTime(0, ac.currentTime, 0.5);
        M = null;
      }

      // ---------- sequence ----------
      async function run(from = 0) {
        if (isTerminated) return;
        const t = ++token;
        for (let i = from; i < PANELS.length; i++) {
          if (isTerminated || token !== t) return;
          idx = i;
          const P = PANELS[i];
          cam.style.transitionDuration = '1.9s';
          frame(P.p);
          await morph(P.p, 1500);
          if (isTerminated || token !== t) return;
          document.querySelectorAll('#dots i').forEach((d, k) => d.classList.toggle('d', k <= i));
          cap.classList.add('on');
          setLevel(i >= 4 ? 2 : i >= 2 ? 1 : 0);
          if (!isTerminated && SFX[P.sfx]) SFX[P.sfx]();
          if (i >= 2) {
            cam.parentElement.classList.remove('shake');
            void cam.offsetWidth;
            $('drift').classList.add('shake');
          }
          const ms = Math.max(5000, P.t.length * 68);
          type(P.t, ms);
          await speak(P.t, ms);
          if (isTerminated || token !== t) return;
          if (!(await hold(700))) return;
          if (isTerminated || token !== t) return;
        }
        if (!isTerminated) finale(t);
      }
      async function finale(t) {
        if (isTerminated) return;
        idx = 99;
        cap.classList.remove('on');
        txt.textContent = '';
        cam.style.transitionDuration = '2.6s';
        frame(
          [
            [0, 0],
            [W, 0],
            [W, H],
            [0, H],
          ],
          0.94,
          0.5,
        );
        await morph(FULL, 2200, 0);
        if (isTerminated || token !== t) return;
        await sleep(1600);
        if (isTerminated || token !== t) return;
        $('bar').classList.remove('on');
        if (!isTerminated) riser(2.6);
        await sleep(1100);
        if (isTerminated || token !== t) return;
        if (!isTerminated) SFX.boom();
        zoomPoint(790, 1385, 5.5, 1800);
        await sleep(1500);
        if (isTerminated || token !== t) return;
        const fl = $('flash');
        fl.style.transition = 'opacity .15s';
        fl.style.opacity = 1;
        await sleep(260);
        if (isTerminated || token !== t) return;
        stopMusic();
        fl.style.transition = 'background 1.2s';
        fl.style.background = '#000';
        await sleep(1400);
        if (isTerminated || token !== t) return;
        terminateCutscene();
        cutsceneDone();
      }
      function skip() {
        terminateCutscene();
        try {
          if (window.parent && window.parent.game) {
            const ps = window.parent.game.sound;
            if (ps) {
              if (ps.context && ps.context.state === 'suspended') {
                ps.context.resume();
              }
              ps.locked = false;
              ps.unlocked = true;
              ps.emit('unlocked', ps);
            }
          }
        } catch (e) {}
        cutsceneDone();
      }

      // ---------- controls ----------
      function boot() {
        if (isTerminated) return;
        initAudio();
        startMusic();
        $('bar').classList.add('on');
        if (ac && ac.state === 'suspended') {
          $('hint').classList.add('on');
          const un = () => {
            ac.resume();
            $('hint').classList.remove('on');
          };
          ['pointerdown', 'keydown', 'touchstart'].forEach((e) =>
            addEventListener(e, un, { once: true }),
          );
        }
        cur = FULL.map((a) => a.slice());
        draw();
        cam.style.transitionDuration = '0s';
        frame(FULL, 0.94, 0.5);
        bootTimer = setTimeout(() => {
          if (!isTerminated) {
            cam.style.transitionDuration = '1.9s';
            run(0);
          }
        }, 1200);
      }
      $('bm').onclick = () => {
        muted = !muted;
        $('bm').textContent = muted ? 'Sound off' : 'Sound on';
        musVol();
      };
      $('bp').onclick = () => {
        paused = !paused;
        $('bp').textContent = paused ? 'Play' : 'Pause';
        paused ? ac && ac.suspend() : ac && ac.resume();
      };
      $('bs').onclick = skip;
      addEventListener('keydown', (e) => {
        if (e.code === 'Space' && idx >= 0) {
          e.preventDefault();
          $('bp').click();
        }
        if (e.code === 'ArrowRight' || e.code === 'Escape') skip();
      });

      // ---------- ember particles ----------
      const fx = $('fx'),
        fc = fx.getContext('2d');
      let E = [];
      function rs() {
        fx.width = innerWidth;
        fx.height = innerHeight;
      }
      rs();
      addEventListener('resize', rs);
      for (let i = 0; i < 55; i++)
        E.push({
          x: Math.random(),
          y: Math.random(),
          r: Math.random() * 2 + 0.5,
          v: Math.random() * 0.0007 + 0.0002,
          a: Math.random() * 6,
        });
      (function tick() {
        fc.clearRect(0, 0, fx.width, fx.height);
        fc.fillStyle = '#ffffff';
        E.forEach((e) => {
          e.y -= e.v;
          e.a += 0.02;
          e.x += Math.sin(e.a) * 0.0004;
          if (e.y < 0) {
            e.y = 1;
            e.x = Math.random();
          }
          fc.globalAlpha = 0.25 + 0.3 * Math.sin(e.a * 2);
          fc.beginPath();
          fc.arc(e.x * fx.width, e.y * fx.height, e.r, 0, 7);
          fc.fill();
        });
        requestAnimationFrame(tick);
      })();

      // ---------- hand-off to your game ----------
      // Cutscene ends on black. Hook your Level 1 here:
      //   window.addEventListener('cutscene:complete', () => { /* start Level 1 */ });
      // or set window.onCutsceneComplete = () => {...} before this script runs.
      function cutsceneDone() {
        window.dispatchEvent(new CustomEvent('cutscene:complete'));
        if (typeof window.onCutsceneComplete === 'function') window.onCutsceneComplete();
        try {
          if (window.parent && window.parent !== window) {
            window.parent.dispatchEvent(new CustomEvent('cutscene:complete'));
            window.parent.postMessage('cutscene:complete', '*');
            if (typeof window.parent.onCutsceneComplete === 'function')
              window.parent.onCutsceneComplete();
          }
        } catch (e) {}
      }
      draw();
      boot();
    </script>
  </body>
</html>
