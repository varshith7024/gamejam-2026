<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fallen Ruins – Final Cutscene</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800;900&family=Cinzel+Decorative:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #0a0907;
        --paper: #ffffff;
        --gold: #ffffff;
        --blood: #c0392b;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--ink);
        overflow: hidden;
        font-family: 'Cinzel', Georgia, serif;
        color: var(--paper);
      }
      #view {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #cam {
        position: absolute;
        left: 0;
        top: 0;
        width: 1024px;
        height: 1365px;
        transform-origin: 0 0;
        transition: transform 1.9s cubic-bezier(0.65, 0, 0.2, 1);
      }
      #drift {
        width: 1024px;
        height: 1365px;
        position: relative;
        animation: drift 14s ease-in-out infinite alternate;
      }
      @keyframes drift {
        from {
          transform: scale(1);
        }
        to {
          transform: scale(1.035) translate(-6px, -4px);
        }
      }
      #drift {
        perspective: 2600px;
      }
      #drift img {
        position: absolute;
        left: 0;
        top: 0;
        width: 1024px;
        height: 1365px;
        display: block;
      }
      #leaf {
        position: absolute;
        left: 0;
        top: 0;
        width: 1024px;
        height: 1365px;
        transform-origin: 0 50%;
        transform-style: preserve-3d;
      }
      #leaf.turn {
        animation: turn 1.9s cubic-bezier(0.55, 0, 0.3, 1) forwards;
      }
      @keyframes turn {
        to {
          transform: rotateY(-180deg);
        }
      }
      #pg,
      #back {
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      #back {
        position: absolute;
        left: 0;
        top: 0;
        width: 1024px;
        height: 1365px;
        background: #d8cfba;
        transform: rotateY(180deg);
        box-shadow: inset -40px 0 60px #0006;
      }
      #pgm {
        transform: scaleX(-1);
        opacity: 0.18;
      }
      #cast {
        position: absolute;
        left: 0;
        top: 0;
        width: 1024px;
        height: 1365px;
        background: linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.8),
          rgba(0, 0, 0, 0.25) 55%,
          transparent
        );
        opacity: 0;
        pointer-events: none;
      }
      #cast.on {
        animation: cast 1.9s forwards;
      }
      @keyframes cast {
        0% {
          opacity: 0;
        }
        40% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      #shade {
        position: absolute;
        inset: 0;
        width: 1024px;
        height: 1365px;
      }
      .shake {
        animation: shake 0.5s linear 2;
      }
      @keyframes shake {
        0%,
        100% {
          transform: translate(0);
        }
        20% {
          transform: translate(-9px, 5px);
        }
        40% {
          transform: translate(8px, -6px);
        }
        60% {
          transform: translate(-6px, -4px);
        }
        80% {
          transform: translate(5px, 6px);
        }
      }
      #vig {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0, 0, 0, 0.85) 100%);
      }
      #fx {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #cap {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 48px 6vw calc(26px + env(safe-area-inset-bottom, 0px));
        background: linear-gradient(transparent, rgba(5, 4, 3, 0.92) 55%);
        text-align: center;
        opacity: 0;
        transition: opacity 0.8s;
        pointer-events: none;
      }
      #cap.on {
        opacity: 1;
      }
      #txt {
        white-space: pre-line;
        font-size: clamp(17px, 2.2vw, 27px);
        line-height: 1.6;
        max-width: 900px;
        margin: 0 auto;
        min-height: 3.6em;
        font-family: 'Cinzel', Georgia, serif;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      #dots {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 12px;
      }
      #dots i {
        width: 34px;
        height: 3px;
        background: #ffffff30;
        transition: 0.5s;
      }
      #dots i.d {
        background: var(--gold);
      }
      #bar {
        position: absolute;
        top: calc(14px + env(safe-area-inset-top, 0px));
        right: 14px;
        display: flex;
        gap: 8px;
        z-index: 5;
        opacity: 0;
        transition: opacity 0.6s;
      }
      #bar.on {
        opacity: 1;
      }
      #bar button {
        background: rgba(0, 0, 0, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.4);
        color: var(--paper);
        font-family: 'Cinzel', Georgia, serif;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 1px;
        padding: 6px 16px;
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      #bar button:hover,
      button:focus-visible {
        border-color: var(--gold);
        outline: none;
        color: var(--gold);
      }
      #flash {
        position: absolute;
        inset: 0;
        background: #fff;
        opacity: 0;
        pointer-events: none;
        z-index: 8;
      }
      @media (prefers-reduced-motion: reduce) {
        #drift {
          animation: none;
        }
        #cam {
          transition-duration: 0.4s;
        }
      }
      #hint {
        position: absolute;
        top: calc(16px + env(safe-area-inset-top, 0px));
        left: 16px;
        font-family: 'Cinzel', Georgia, serif;
        font-size: 15px;
        letter-spacing: 0.5px;
        color: var(--gold);
        opacity: 0;
        transition: opacity 0.6s;
        z-index: 5;
        pointer-events: none;
      }
      #hint.on {
        opacity: 0.9;
      }
      #blk {
        position: absolute;
        inset: 0;
        background: #000;
        opacity: 0;
        transition: opacity 0.9s;
        pointer-events: none;
        z-index: 8;
      }
    </style>
  </head>
  <body>
    <div id="view">
      <div id="cam">
        <div id="drift">
          <img id="under" alt="" />
          <div id="cast"></div>
          <div id="leaf">
            <img id="pg" alt="Manga page" />
            <div id="back"><img id="pgm" alt="" /></div>
          </div>
          <svg id="shade" viewBox="0 0 1024 1365">
            <path id="dim" fill="#050403" fill-opacity=".92" fill-rule="evenodd" />
            <polygon
              id="rim"
              fill="none"
              stroke="#ffffff"
              stroke-width="5"
              stroke-linejoin="round"
              style="filter: drop-shadow(0 0 14px #ffffff)"
            />
          </svg>
        </div>
      </div>
    </div>
    <canvas id="fx"></canvas>
    <div id="vig"></div>
    <div id="cap">
      <div id="txt"></div>
      <div id="dots"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div id="bar">
      <button id="bm" aria-label="Mute">Sound on</button><button id="bp">Pause</button
      ><button id="bs">Skip</button>
    </div>
    <div id="blk"></div>
    <div id="flash"></div>
    <div id="hint">Tap anywhere for sound</div>

      function morph(to, ms = 1500, op = 1) {
        return new Promise((res) => {
          const from = cur.map((a) => a.slice()),
            t0 = performance.now();
          const e = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
          (function f(now) {
            const k = Math.min(1, (now - t0) / ms),
              s = e(k);
            cur = from.map((a, i) => [a[0] + (to[i][0] - a[0]) * s, a[1] + (to[i][1] - a[1]) * s]);
            draw();
            rim.style.opacity = op;
            k < 1 ? requestAnimationFrame(f) : res();
          })(t0);
        });

      function bbox(p) {
        const x = p.map((a) => a[0]),
          y = p.map((a) => a[1]);

      function frame(p, pad = 0.88, cy = 0.42) {

          bw = b.x1 - b.x0,

        const s = Math.min((vw * pad) / bw, (vh * 0.6) / bh);
        const cx = (b.x0 + b.x1) / 2,
          cyy = (b.y0 + b.y1) / 2;
        cam.style.transform = `translate(${vw / 2 - cx * s}px,${vh * cy - cyy * s}px) scale(${s})`;

      function noise(d, f0, f1, g = 0.5, type = 'lowpass') {
        if (!ac || muted || isTerminated) return;
        const n = ac.sampleRate * d,
          b = ac.createBuffer(1, n, ac.sampleRate),
          c = b.getChannelData(0);
        for (let i = 0; i < n; i++) c[i] = (Math.random() * 2 - 1) * (1 - i / n);
        const s = ac.createBufferSource();
        s.buffer = b;
        const f = ac.createBiquadFilter();
        f.type = type;
        f.frequency.setValueAtTime(f0, ac.currentTime);
        f.frequency.exponentialRampToValueAtTime(f1, ac.currentTime + d);
        const gn = ac.createGain();
        gn.gain.value = g;
        s.connect(f).connect(gn).connect(ac.destination);
        s.start();
      }

        if (!ac || muted || isTerminated) return;

        o.type = type;
        o.frequency.setValueAtTime(fr, ac.currentTime);
        o.frequency.exponentialRampToValueAtTime(fr2, ac.currentTime + d);
        gn.gain.setValueAtTime(g, ac.currentTime);
        gn.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d);
        o.connect(gn).connect(ac.destination);
        o.start();
        o.stop(ac.currentTime + d);

      const MEL = [
        [
          [659.3, 0, 3],
          [587.3, 3, 1.6],
          [523.3, 4.6, 1.6],
          [493.9, 6.2, 3.6],
        ],
        [
          [523.3, 0, 3],
          [440, 3, 1.6],
          [523.3, 4.6, 1.6],
          [698.5, 6.2, 3.6],
        ],
        [
          [659.3, 0, 3],
          [784, 3, 1.6],
          [880, 4.6, 1.6],
          [784, 6.2, 3.6],
        ],
        [
          [830.6, 0, 3],
          [659.3, 3, 1.6],
          [493.9, 4.6, 1.6],
          [415.3, 6.2, 3.6],
        ],
      ];
      function startMusic() {
        if (!ac || M) return;
        const out = ac.createGain();
        out.gain.value = 0;
        const lp = ac.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 700;
        lp.Q.value = 0.5;
        const bus = ac.createGain(),
          pl = ac.createGain(),
          conv = ac.createConvolver(),
          wet = ac.createGain();
        wet.gain.value = 0.9;
        const len = ac.sampleRate * 6,
          ib = ac.createBuffer(2, len, ac.sampleRate);
        for (let c = 0; c < 2; c++) {
          const d = ib.getChannelData(c);
          for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
        }
        conv.buffer = ib;
        bus.connect(lp);
        lp.connect(out);
        pl.connect(out);
        out.connect(ac.destination);
        out.connect(conv);
        conv.connect(wet);
        wet.connect(ac.destination);
        M = { out, lp, bus, pl, level: 0, chord: 0, began: false };
        musVol(3);
        ac.onstatechange = () => {
          if (ac.state === 'running' && M && !M.began) chord();
        };
        if (ac.state === 'running') chord();
        M.t1 = setInterval(() => {
          if (M.began && ac.state === 'running') chord();
        }, 10000);
      }
      function note(f, at, a, pk, dec, type = 'triangle') {
        const o = ac.createOscillator(),
          g = ac.createGain();
        o.type = type;
        o.frequency.value = f;
        g.gain.setValueAtTime(0, at);
        g.gain.linearRampToValueAtTime(pk, at + a);
        g.gain.exponentialRampToValueAtTime(0.001, at + a + dec);
        o.connect(g).connect(M.pl);
        o.start(at);
        o.stop(at + a + dec + 0.1);
      }
      function vib(o, at) {
        const v = ac.createOscillator(),
          g = ac.createGain();
        v.frequency.value = 5.6;
        g.gain.setValueAtTime(0, at);
        g.gain.linearRampToValueAtTime(24, at + 1);
        v.connect(g).connect(o.detune);
        return v;
      }
      function lead(f, at, d, vol, cut, prev) {
        const o = ac.createOscillator(),
          o2 = ac.createOscillator(),
          g = ac.createGain(),
          fl = ac.createBiquadFilter();
        o.type = 'sawtooth';
        o2.type = 'triangle';
        fl.type = 'lowpass';
        fl.frequency.value = cut;
        [o, o2].forEach((x) => {
          if (prev) {
            x.frequency.setValueAtTime(prev, at);
            x.frequency.exponentialRampToValueAtTime(f, at + 0.2);
          } else x.frequency.value = f;
        });
        const v1 = vib(o, at),
          v2 = vib(o2, at);
        g.gain.setValueAtTime(0, at);
        g.gain.linearRampToValueAtTime(vol, at + 0.5);
        g.gain.setValueAtTime(vol, at + d);
        g.gain.exponentialRampToValueAtTime(0.001, at + d + 1.5);
        o.connect(fl);
        o2.connect(fl);
        fl.connect(g).connect(M.pl);
        [o, o2, v1, v2].forEach((x) => {
          x.start(at);
          x.stop(at + d + 1.6);
        });
      }
      function swell(d, pk) {
        if (!ac || muted || !M) return;
        const n = ac.sampleRate * d,
          b = ac.createBuffer(1, n, ac.sampleRate),
          c = b.getChannelData(0);
        for (let i = 0; i < n; i++) c[i] = Math.random() * 2 - 1;
        const s = ac.createBufferSource(),
          f = ac.createBiquadFilter(),
          g = ac.createGain(),
          T = ac.currentTime;
        s.buffer = b;
        f.type = 'bandpass';
        f.Q.value = 0.8;
        f.frequency.setValueAtTime(300, T);
        f.frequency.exponentialRampToValueAtTime(2500, T + d);
        g.gain.setValueAtTime(0, T);
        g.gain.linearRampToValueAtTime(pk, T + d * 0.9);
        g.gain.linearRampToValueAtTime(0, T + d);
        s.connect(f).connect(g).connect(M.pl);
        s.start(T);
      }
      function climax() {
        if (!M) return;
        swell(4.5, 0.45);
        tone(49, 30, 3.5, 'sine', 0.85);
        setTimeout(() => tone(98, 45, 2.5, 'triangle', 0.25), 300);
      }
      function chord() {
        if (!M) return;
        M.began = true;
        const ci = M.chord++ % 4,
          c = CH[ci],
          T = ac.currentTime,
          D = 10,
          L = M.level;
        c.forEach((f, i) =>
          [-5, 5].forEach((dt) => {
            const o = ac.createOscillator(),
              g = ac.createGain();
            o.type = i < 2 ? 'sawtooth' : 'triangle';
            o.frequency.value = f;
            o.detune.value = dt;
            g.gain.setValueAtTime(0, T);
            g.gain.linearRampToValueAtTime(i < 2 ? 0.16 : 0.07, T + 3.5);
            g.gain.linearRampToValueAtTime(0, T + D + 2.5);
            o.connect(g).connect(M.bus);
            o.start(T);
            o.stop(T + D + 2.6);
          }),
        );
        if (L === 0) {
          MEL[ci].forEach(([f, dt]) => note(f, T + dt + 0.5, 0.01, 0.1, 3.5));
          [1, 3, 2, 4].forEach((n, k) => note(c[n] * 2, T + 0.4 + k * 2.4, 0.01, 0.05, 3));
        }
        if (L === 1) {
          note(c[0] * 2, T, 0.01, 0.2, 4);
          [1, 2, 3, 4, 3, 2, 4, 3].forEach((n, k) =>
            note(c[n] * 2, T + 0.4 + k * 1.2, 0.01, 0.1, 2.8),
          );
          lead(c[2], T + 0.2, D - 2, 0.13, 900);
          let prev = 0;
          MEL[ci].forEach(([f, dt, d]) => {
            lead(f, T + dt + 0.4, d, 0.17, 2600, prev);
            lead(f * 2, T + dt + 0.4, d, 0.04, 3500, prev ? prev * 2 : 0);
            prev = f;
          });
          swell(6, 0.2);
          tone(55, 32, 2.4, 'sine', 0.5);
        }
        if (L >= 2) {
          note(c[2] * 4, T + 1.2, 0.01, 0.08, 6, 'sine');
          note(MEL[ci][0][0] * 2, T + 4.8, 0.01, 0.06, 6, 'sine');
        }
      }
      function musVol(tc = 0.8) {
        if (M) M.out.gain.setTargetAtTime(muted ? 0 : 0.62, ac.currentTime, tc);
      }
      function setLevel(n) {
        if (!M || M.level === n) return;
        M.level = n;
        M.lp.frequency.setTargetAtTime(n === 1 ? 1600 : n === 2 ? 380 : 700, ac.currentTime, 1.5);
        M.bus.gain.setTargetAtTime(n === 2 ? 0.18 : 1, ac.currentTime, 2.5);
        if (M.began && ac.state === 'running') chord();
      }
      function stopMusic(tc = 0.5) {
        if (!M) return;
        clearInterval(M.t1);
        M.out.gain.setTargetAtTime(0, ac.currentTime, tc);
        M = null;
      }

      // ---------- sequence ----------
      let curPg = 0;
      const LV = [0, 0, 1, 1, 2];
      async function switchPage(n, t) {
        const lf = $('leaf'),
          cs = $('cast');
        lf.classList.remove('turn');
        cs.classList.remove('on');
        void lf.offsetWidth;
        cap.classList.remove('on');
        cam.style.transitionDuration = '1.8s';
        frame(FULL, 0.94, 0.5);
        await morph(FULL, 1400, 0);
        if (token !== t) return false;
        await sleep(500);
        if (token !== t) return false;
        $('under').src = IMGS[n] || IMGS[0];
        SFX.page();
        lf.classList.add('turn');
        cs.classList.add('on');
        await sleep(1900);
        if (token !== t) return false;
        pg.src = IMGS[n] || IMGS[0];
        $('pgm').src = IMGS[n] || IMGS[0];
        curPg = n;
        await sleep(80);
        lf.classList.remove('turn');
        cs.classList.remove('on');
        await sleep(500);
        return token === t;
      }
      async function run(from = 0) {
        if (isTerminated) return;
        const t = ++token;
        for (let i = from; i < PANELS.length; i++) {
          if (isTerminated || token !== t) return;
          idx = i;
          const P = PANELS[i];
          if (P.pg !== curPg && !(await switchPage(P.pg, t))) return;
          cam.style.transitionDuration = '1.9s';
          frame(P.p);
          await morph(P.p, 1500);
          if (isTerminated || token !== t) return;
          document.querySelectorAll('#dots i').forEach((d, k) => d.classList.toggle('d', k <= i));
          cap.classList.add('on');
          setLevel(LV[i]);
          if (!isTerminated && SFX[P.sfx]) SFX[P.sfx]();
          if ((i === 2 || i === 3) && !isTerminated) climax();
          if (P.shake) {
            const v = $('view');
            v.classList.remove('shake');
            void v.offsetWidth;
            v.classList.add('shake');
          }
          const ms = Math.max(4500, P.t.join(' ').length * 72 + (P.t.length - 1) * 800);
          type(P.t.join('\n'), ms);
          await hold(ms);
          if (isTerminated || token !== t) return;
          if (!(await hold(i === PANELS.length - 1 ? 1800 : 900))) return;
          if (isTerminated || token !== t) return;
        }
        if (!isTerminated) finale(t);
      }
      async function finale(t) {
        if (isTerminated) return;
        idx = 99;
        cap.classList.remove('on');
        txt.textContent = '';
        $('bar').classList.remove('on');
        await sleep(500);
        if (isTerminated || token !== t) return;
        const s = Math.max(innerWidth / 600, innerHeight / 380) * 1.35;
        zoomPoint(533, 720, s, 5200);
        await sleep(2600);
        if (isTerminated || token !== t) return;
        stopMusic(1.6);
        const fl = $('flash');
        fl.style.transition = 'opacity 3.2s ease-in';
        fl.style.opacity = 1;
        await sleep(3800);
        if (isTerminated || token !== t) return;
        terminateCutscene();
        cutsceneDone();
      }
      function skip() {
        terminateCutscene();
        try {
          if (window.parent && window.parent.game) {
            const ps = window.parent.game.sound;
            if (ps) {
              if (ps.context && ps.context.state === 'suspended') {
                ps.context.resume();
              }
              ps.locked = false;
              ps.unlocked = true;
              ps.emit('unlocked', ps);
            }
          }
        } catch (e) {}
        cutsceneDone();
      }

      // ---------- controls ----------
      function boot() {
        if (isTerminated) return;
        pg.src = IMGS[0];
        $('pgm').src = IMGS[0];
        $('under').src = IMGS[1] || IMGS[0];
        initAudio();
        startMusic();
        $('bar').classList.add('on');
        if (ac && ac.state === 'suspended') {
          $('hint').classList.add('on');
          const un = () => {
            ac.resume();
            $('hint').classList.remove('on');
          };
          ['pointerdown', 'keydown', 'touchstart'].forEach((e) =>
            addEventListener(e, un, { once: true }),
          );
        }
        cur = FULL.map((a) => a.slice());
        draw();
        cam.style.transitionDuration = '0s';
        frame(FULL, 0.94, 0.5);
        bootTimer = setTimeout(() => {
          if (!isTerminated) {
            cam.style.transitionDuration = '1.9s';
            run(0);
          }
        }, 1200);
      }
      $('bm').onclick = () => {
        muted = !muted;
        $('bm').textContent = muted ? 'Sound off' : 'Sound on';
        musVol();
      };
      $('bp').onclick = () => {
        paused = !paused;
        $('bp').textContent = paused ? 'Play' : 'Pause';
        paused
          ? ac && ac.suspend()
          : ac && ac.resume();
      };
      $('bs').onclick = skip;
      addEventListener('keydown', (e) => {
        if (e.code === 'Space' && idx >= 0) {
          e.preventDefault();
          $('bp').click();
        }
        if (e.code === 'ArrowRight' || e.code === 'Escape') skip();
      });

      // ---------- ember particles ----------
      const fx = $('fx'),
        fc = fx.getContext('2d');
      let E = [];
      function rs() {
        fx.width = innerWidth;
        fx.height = innerHeight;
      }
      rs();
      addEventListener('resize', rs);
      for (let i = 0; i < 55; i++)
        E.push({
          x: Math.random(),
          y: Math.random(),
          r: Math.random() * 2 + 0.5,
          v: Math.random() * 0.0007 + 0.0002,
          a: Math.random() * 6,
        });
      (function tick() {
        fc.clearRect(0, 0, fx.width, fx.height);
        fc.fillStyle = '#ffffff';
        E.forEach((e) => {
          e.y += e.v * 0.6;
          e.a += 0.02;
          e.x += Math.sin(e.a) * 0.0004;
          if (e.y > 1) {
            e.y = 0;
            e.x = Math.random();
          }
          fc.globalAlpha = 0.25 + 0.3 * Math.sin(e.a * 2);
          fc.beginPath();
          fc.arc(e.x * fx.width, e.y * fx.height, e.r, 0, 7);
          fc.fill();
        });
        requestAnimationFrame(tick);
      })();

      // ---------- hand-off to your game ----------
      // Cutscene ends on white (the void). Hook your Level 1 here:
      //   window.addEventListener('cutscene:complete', () => { /* start Level 1 */ });
      // or set window.onCutsceneComplete = () => {...} before this script runs.
      function cutsceneDone() {
        window.dispatchEvent(new CustomEvent('cutscene:complete'));
        if (typeof window.onCutsceneComplete === 'function') window.onCutsceneComplete();
        try {
          if (window.parent && window.parent !== window) {
            window.parent.dispatchEvent(new CustomEvent('cutscene:complete'));
            window.parent.postMessage('cutscene:complete', '*');
            if (typeof window.parent.onCutsceneComplete === 'function')
              window.parent.onCutsceneComplete();
          }
        } catch (e) {}
      }
      draw();
      boot();
    </script>
  </body>
</html>
